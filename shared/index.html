<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdNa – vyvolávací systém</title>
<link rel="stylesheet" href="/shared/adna-theme.css">
<style>
  body { padding: 48px 16px; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 40px; margin: 0 0 8px; }
  p { color: var(--adna-muted); font-size: 18px; }
  a.card { display: block; padding: 22px 24px; margin: 14px 0; border: 1px solid var(--adna-border); border-radius: var(--adna-radius);
    text-decoration: none; color: var(--adna-text); box-shadow: var(--adna-shadow); font-size: 20px; }
  a.card:hover, a.card:focus { border-color: var(--adna-accent); outline: none; }
  a.card small { display: block; color: var(--adna-muted); font-size: 15px; margin-top: 4px; }
</style>
</head>
<body><main>
  <h1 class="adna-wordmark">Ad<span class="accent">Na</span></h1>
  <p>Vyvolávací systém – server beží. Zvoľte rozhranie:</p>
  <a class="card" href="/sestra/">Sestra a administrácia<small>Počítač sestry (Windows – inštalovateľná aplikácia)</small></a>
  <a class="card" href="/tablet/">Tablet pre pacientov<small>Normálne sa otvára v Android aplikácii „AdNa Tablet“</small></a>
  <a class="card" href="/obrazovka/">Obrazovka v čakárni<small>Normálne sa otvára v Android TV aplikácii „AdNa Obrazovka“</small></a>
</main></body>
</html>
