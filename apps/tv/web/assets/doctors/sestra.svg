<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <!-- Náhradný obrázok sestry (napr. zastupujúca sestra / externistka bez fotky). Ilustrácia, nie fotka skutočnej osoby. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef0f4"/></linearGradient>
    <linearGradient id="scrub" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d81b36"/><stop offset="1" stop-color="#b30d27"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d3bd"/><stop offset="1" stop-color="#e9b99c"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b4a35"/><stop offset="1" stop-color="#4a3122"/></linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <!-- vlasy vzadu -->
  <path d="M190 250c0-95 50-160 110-160s110 65 110 160c0 70-8 140-22 190H212c-14-50-22-120-22-190z" fill="url(#hair)"/>
  <!-- krk -->
  <path d="M265 330h70v70c0 20-15 32-35 32s-35-12-35-32z" fill="#e3ad8e"/>
  <!-- telo – červený zdravotnícky odev -->
  <path d="M120 900V560c0-80 50-140 120-160l60 70 60-70c70 20 120 80 120 160v340z" fill="url(#scrub)"/>
  <path d="M240 400l60 70 60-70-18-8-42 50-42-50z" fill="#a50b22"/>
  <path d="M258 402l42 48 42-48c-12-6-26-10-42-10s-30 4-42 10z" fill="#e3ad8e"/>
  <!-- vrecko s perom -->
  <rect x="330" y="560" width="70" height="60" rx="8" fill="#c0122d" stroke="#a50b22" stroke-width="3"/>
  <rect x="345" y="535" width="8" height="40" rx="3" fill="#111"/>
  <!-- stetoskop -->
  <path d="M235 420c-25 60-25 120 15 160 30 28 70 28 100 0 40-40 40-100 15-160" fill="none" stroke="#2b2b2b" stroke-width="9" stroke-linecap="round"/>
  <circle cx="300" cy="602" r="18" fill="#9aa1ab" stroke="#2b2b2b" stroke-width="6"/>
  <!-- hlava -->
  <ellipse cx="300" cy="245" rx="88" ry="105" fill="url(#skin)"/>
  <!-- vlasy vpredu -->
  <path d="M212 240c0-80 40-130 88-130s92 45 92 125c-30-10-70-35-92-75-15 40-50 70-88 80z" fill="url(#hair)"/>
  <!-- tvár -->
  <ellipse cx="268" cy="250" rx="8" ry="9" fill="#3a2a20"/>
  <ellipse cx="332" cy="250" rx="8" ry="9" fill="#3a2a20"/>
  <path d="M255 228q13-8 26 0M319 228q13-8 26 0" stroke="#4a3122" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M300 258q-6 22 2 30" stroke="#d29a7c" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M276 302q24 18 48 0" stroke="#b5485a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <ellipse cx="252" cy="285" rx="14" ry="8" fill="#f0a9a0" opacity=".45"/>
  <ellipse cx="348" cy="285" rx="14" ry="8" fill="#f0a9a0" opacity=".45"/>
  <!-- menovka -->
  <rect x="160" y="770" width="280" height="76" rx="14" fill="#ffffff" opacity=".95"/>
  <text x="300" y="822" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#c8102e" letter-spacing="2">SESTRA</text>
</svg>
