# Automatické zostavenie: testy servera a APK pre tablet aj TV (GitHub Actions).
# Výsledné APK nájdete v záložke Actions → beh → Artifacts.
name: Zostavenie AdNa
on:
  push:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zostavenie obrazu a test spustenia
        run: |
          docker build -t adna-server .
          docker run -d --name adna -p 8080:8080 adna-server
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/sestra/ && break; sleep 1; done
          for p in sestra/ tablet/ obrazovka/ shared/adna-theme.css; do curl -fsS -o /dev/null "http://127.0.0.1:8080/$p"; done
          docker exec adna test -f /data/SETUP-KOD.txt
          docker logs adna | tail -5

  windows:
    # skutočný inštalačný skript pre lokálny server v ambulancii na čistom Windows (bez tunela)
    runs-on: windows-latest
    steps:
      - name: Inštalácia servera na Windows a kontrola
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $ref = "${{ github.sha }}"
          Invoke-WebRequest "https://raw.githubusercontent.com/${{ github.repository }}/$ref/deploy/windows/Instalovat-server.ps1" -OutFile "$env:TEMP\adna.ps1"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:TEMP\adna.ps1" -Vetva $ref -BezTunela
          Invoke-RestMethod http://localhost:8080/api/health
          if (-not (Test-Path C:\AdNa\data\SETUP-KOD.txt)) { throw "Chýba inštalačný kód" }
          (Invoke-WebRequest -UseBasicParsing http://localhost:8080/sestra/).StatusCode
          Get-ScheduledTask -TaskName "AdNa*" | Format-Table TaskName, State
          # bez nového commitu aktualizácia nič nerobí a server beží ďalej
          powershell -NoProfile -ExecutionPolicy Bypass -File C:\AdNa\aktualizuj.ps1 -Vetva $ref
          # vynútená aktualizácia: záloha, výmena kódu, reštart
          powershell -NoProfile -ExecutionPolicy Bypass -File C:\AdNa\aktualizuj.ps1 -Vetva $ref -Vynutit
          Start-Sleep 5
          Invoke-RestMethod http://localhost:8080/api/health
          $z = @(Get-ChildItem C:\AdNa\data\zalohy -Filter *.db)
          if ($z.Count -lt 1) { throw "Chýba záloha" }
          $z | ForEach-Object { $_.Name }
          Get-Content C:\AdNa\aktualizacia.log
      - uses: actions/checkout@v4
      - name: Spúšťač obrazovky – syntax a zoznam súborov pre online aktualizáciu
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $chyby = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\apps\tv\minipc\spustit-obrazovku.ps1", [ref]$null, [ref]$chyby) | Out-Null
          if ($chyby) { $chyby | Format-List; throw "Chyba syntaxe v spustit-obrazovku.ps1" }
          Get-Content apps\tv\minipc\subory.txt | Where-Object { $_ -and -not $_.StartsWith("#") } | ForEach-Object {
            if (-not (Test-Path "apps\tv\minipc\$_")) { throw "subory.txt: chýba $_" } }

  apk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [tablet, tv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          # predvolený balík 'tools' už v sdkmanageri neexistuje → zostavenie padalo
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Zostaviť debug APK
        working-directory: apps/${{ matrix.app }}/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: adna-${{ matrix.app }}-debug-apk
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk
