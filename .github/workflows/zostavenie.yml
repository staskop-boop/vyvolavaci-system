# Automatické zostavenie: testy servera a APK pre tablet aj TV (GitHub Actions).
# Výsledné APK nájdete v záložke Actions → beh → Artifacts.
name: Zostavenie AdNa
on:
  push:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zostavenie obrazu a test spustenia
        run: |
          docker build -t adna-server .
          docker run -d --name adna -p 8080:8080 adna-server
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/sestra/ && break; sleep 1; done
          for p in sestra/ tablet/ obrazovka/ shared/adna-theme.css; do curl -fsS -o /dev/null "http://127.0.0.1:8080/$p"; done
          docker exec adna test -f /data/SETUP-KOD.txt
          docker logs adna | tail -5

  apk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [tablet, tv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Zostaviť debug APK
        working-directory: apps/${{ matrix.app }}/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: adna-${{ matrix.app }}-debug-apk
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk
