# Android appka „AdNa Prehľad“ – zostaví APK a zverejní ho na stálej adrese (vydanie „prehlad-android“),
# aby sa dalo stiahnuť priamo v telefóne:
#   https://github.com/staskop-boop/vyvolavaci-system/releases/download/prehlad-android/AdNa-Prehlad.apk
# Beží len pri zmene appky (apps/prehlad/android) alebo ručne. Obsah (stránka /prehlad/) sa aktualizuje zo servera sám,
# APK netreba preinštalovať pri bežných zmenách.
name: AdNa Prehľad – APK do telefónu
on:
  push:
    branches: [main]
    paths: ['apps/prehlad/android/**', '.github/workflows/prehlad-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Zostaviť APK
        working-directory: apps/prehlad/android
        run: gradle --no-daemon assembleDebug
      - name: Zverejniť APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp apps/prehlad/android/app/build/outputs/apk/debug/*.apk AdNa-Prehlad.apk
          gh release view prehlad-android >/dev/null 2>&1 || gh release create prehlad-android --title "AdNa Prehľad (Android)" \
            --notes "Android appka AdNa Prehľad – živý stav ambulancie na diaľku. Stiahnite AdNa-Prehlad.apk priamo v telefóne a nainštalujte (povoliť inštaláciu z neznámych zdrojov). Prihlásenie kontom zo Sestry." --latest=false
          gh release upload prehlad-android AdNa-Prehlad.apk --clobber
          echo "APK: https://github.com/${{ github.repository }}/releases/download/prehlad-android/AdNa-Prehlad.apk"
