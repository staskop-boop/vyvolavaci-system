name: Kontrola servera vyvolavaci.adna.sk
# Overí z GitHubu, či beží server a ktorú verziu obrazovky práve slúži (bez prihlásenia, len verejné údaje).
on:
  workflow_dispatch:
jobs:
  kontrola:
    runs-on: ubuntu-latest
    steps:
      - name: Stav servera
        run: |
          set -e
          curl -fsS -m 20 https://vyvolavaci.adna.sk/api/health; echo
          S=$(curl -fsS -m 20 https://vyvolavaci.adna.sk/api/display/state)
          echo "$S" | jq -c '{rooms: [.rooms[] | {name, current, calledToday}], queue: [.queue[] | {code, plannedAt, arrivedAt}]}'
          CSS=$(curl -fsS -m 20 https://vyvolavaci.adna.sk/obrazovka/styles.css)
          SESTRA=$(curl -fsS -m 20 https://vyvolavaci.adna.sk/sestra/app.js)
          for f in stasko czetoova kubikova kudela koval roskovicova; do
            echo "fotka $f: $(curl -s -o /dev/null -w '%{http_code}' -m 20 https://vyvolavaci.adna.sk/obrazovka/assets/doctors/$f.jpg)"
          done
          echo "Sestra – verzia na serveri: $(curl -fsS -m 20 https://vyvolavaci.adna.sk/sestra/sw.js | grep -o "adna-sestra-v[0-9]*")"
          echo "Sestra – tlačidlo zobraziť heslo: $(echo "$SESTRA" | grep -c "pw-toggle") · hromadné kontá: $(echo "$SESTRA" | grep -c "btn-bulk-users")"
          echo "Sestra – výber/zmena ambulancie (PR #29): $(echo "$SESTRA" | grep -c "moveTicket")"
          for f in app.js sw.js index.html; do
            echo "--- hlavičky /sestra/$f"; curl -sS -m 20 -D - -o /dev/null https://vyvolavaci.adna.sk/sestra/$f | grep -iE "^(cache-control|cf-cache-status|age|etag|last-modified|content-length|server):" || true
          done
          echo "app.js bez cache: $(curl -fsS -m 20 "https://vyvolavaci.adna.sk/sestra/app.js?t=$(date +%s)" | grep -c moveTicket)"
          echo "app.js v repozitári: $(grep -c moveTicket apps/sestra/web/app.js 2>/dev/null || echo '?')"
          echo "Hlasitosť vyvolania (PR #37): $(echo "$S" | jq -c '.soundVolume')"
          echo "Oprava prihlásenia (PR #38): $(echo "$SESTRA" | grep -c "prihlasujete sa ako")"
          # jeden chybný pokus z IP GitHubu – blokácia je po novom len pre konto + IP, prihlásenie v ambulancii neovplyvní
          echo "Konto czetoova (pokus so zlým heslom): $(curl -sS -m 20 -H 'Content-Type: application/json' -d '{"username":"Czetöová","password":"kontrola-zle-heslo"}' https://vyvolavaci.adna.sk/api/auth/login)"
          if echo "$S" | jq -e '.rooms[0] | has("calledToday")' >/dev/null && echo "$SESTRA" | grep -q "m-ann-clear"; then
            echo "Server slúži aktuálnu verziu obrazovky."
          else
            echo "::error::Server slúži starú verziu – automatická aktualizácia z main neprebehla."
            exit 1
          fi
